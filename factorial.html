<!DOCTYPE html>
<html>
<head>
    <title>Calcular Factorial</title>
</head>
<body>
    <h1>Calculadora de Factorial</h1>

    <form onsubmit="calcularFactorial(event)">
        <label>Número:</label>
        <input type="number" id="numero" min="0" required>
        <br><br>

        <button type="submit">Calcular Factorial</button>
    </form>

    <div id="resultado"></div>

    <br>
    <a href="index.html">Volver al inicio</a>

    <script>
        function calcularFactorial(event) {
            event.preventDefault();
            var n = parseInt(document.getElementById("numero").value);

            if (n < 0) {
                document.getElementById("resultado").innerHTML = "<h2>Error: El número no puede ser negativo</h2>";
                return;
            }

            var resultado = 1;
            for (var i = 2; i <= n; i++) {
                resultado *= i;
            }

            document.getElementById("resultado").innerHTML = "<h2>Resultado: " + n + "! = " + resultado + "</h2>";
        }
    </script>
</body>
</html>
